name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch BakkesMod SDK
        shell: pwsh
        run: |
          $bm = Join-Path $env:RUNNER_TEMP "bakkesmod"
          git clone --depth 1 https://github.com/bakkesmodorg/BakkesModSDK.git (Join-Path $bm "bakkesmodsdk")
          "BAKKESMOD_PATH=$bm" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild Pluginx64.sln /m /p:Configuration=Release /p:Platform=x64 "/p:BakkesModPath=${{ env.BAKKESMOD_PATH }}"

      - uses: actions/upload-artifact@v4
        with:
          name: WorkshopMapLoader
          path: plugins/WorkshopMapLoader.dll
          if-no-files-found: error
